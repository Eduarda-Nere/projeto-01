<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Felipe Lopez</title>
  <meta name="description" content="Lopez Engenharia" />
  <link rel="icon" type="image/png" href="./src/assets/img/logo/mini-logo-azul.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    #initial-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      background: #ffffff;
      z-index: 9999;
    }

    #initial-loader .loader-text {
      margin: 0;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      animation: initial-loader-pulse-text 1.8s ease-in-out infinite;
    }

    @keyframes initial-loader-pulse-text {
      0%, 100% { color: #4a4a4a; }
      50% { color: #a0a0a0; }
    }

    #initial-loader .spinner {
      --uib-size: 40;
      --uib-color: #0f1e38;
      --uib-speed: 3.5s;
      --uib-stroke: 4;
      --uib-mult: calc(var(--uib-size) / var(--uib-stroke));
      --uib-stroke-px: calc(var(--uib-stroke) * 1px);
      --uib-size-px: calc(var(--uib-size) * 1px);
      position: relative;
      height: var(--uib-size-px);
      width: var(--uib-size-px);
    }

    #initial-loader .spinner-line {
      position: absolute;
      top: calc(50% - var(--uib-stroke-px) / 2);
      left: calc(50% - var(--uib-stroke-px) / 2);
      width: var(--uib-stroke-px);
      height: var(--uib-stroke-px);
      background-color: var(--uib-color);
      animation: initial-loader-center-line var(--uib-speed) ease infinite;
    }

    #initial-loader .spinner::before,
    #initial-loader .spinner::after {
      content: '';
      position: absolute;
      width: var(--uib-stroke-px);
      height: var(--uib-stroke-px);
      background-color: var(--uib-color);
      animation: initial-loader-explore var(--uib-speed) ease infinite;
    }

    #initial-loader .spinner::after {
      animation-delay: calc(var(--uib-speed) * -0.5);
    }

    @keyframes initial-loader-center-line {
      0%, 25%, 50%, 75%, 100% { transform: scaleX(1) scaleY(1); }
      12.5%, 62.5% { transform: scaleX(var(--uib-mult)) scaleY(1); }
      37.5%, 87.5% { transform: scaleX(1) scaleY(var(--uib-mult)); }
    }

    @keyframes initial-loader-explore {
      0%, 100% {
        transform: scaleX(1) scaleY(1) translate(0%, 0%);
        transform-origin: top left; top: 0; left: 0;
      }
      12.5% {
        transform: scaleX(var(--uib-mult)) scaleY(1) translate(0%, 0%);
        transform-origin: top left; top: 0; left: 0;
      }
      12.50001% {
        transform: scaleX(var(--uib-mult)) scaleY(1) translate(0%, 0%);
        transform-origin: top right; top: 0; left: initial; right: 0;
      }
      25% {
        transform: scaleX(1) scaleY(1) translate(0%, 0%);
        transform-origin: top right; top: 0; left: initial; right: 0;
      }
      37.5% {
        transform: scaleX(1) scaleY(var(--uib-mult)) translate(0%, 0%);
        transform-origin: top right; top: 0; left: initial; right: 0;
      }
      37.5001% {
        transform: scaleX(1) scaleY(var(--uib-mult)) translate(0%, 0%);
        transform-origin: bottom right; top: initial; bottom: 0; left: initial; right: 0;
      }
      50% {
        transform: scaleX(1) scaleY(1) translate(0%, 0%);
        transform-origin: bottom right; top: initial; bottom: 0; left: initial; right: 0;
      }
      62.5% {
        transform: scaleX(var(--uib-mult)) scaleY(1) translate(0%, 0%);
        transform-origin: bottom right; top: initial; bottom: 0; left: initial; right: 0;
      }
      62.5001% {
        transform: scaleX(var(--uib-mult)) scaleY(1) translate(0%, 0%);
        transform-origin: bottom left; top: initial; bottom: 0; left:0;
      }
      75% {
        transform: scaleX(1) scaleY(1) translate(0%, 0%);
        transform-origin: bottom left; top: initial; bottom: 0; left: 0;
      }
      87.5% {
        transform: scaleX(1) scaleY(var(--uib-mult)) translate(0%, 0%);
        transform-origin: bottom left; top: initial; bottom: 0; left: 0;
      }
      87.5001% {
        transform: scaleX(1) scaleY(var(--uib-mult)) translate(0%, 0%);
        transform-origin: top left; top: 0; left: 0;
      }
    }
  </style>
</head>

<body>
  <div id="root">
    <div id="initial-loader" role="status" aria-label="Carregando conteúdo">
      <div class="spinner">
        <div class="spinner-line"></div>
      </div>
      <p class="loader-text">Carregando</p>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
